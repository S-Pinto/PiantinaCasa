<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Appartamento di Via Verona, piantina in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style id="appcss">
:root{
  --bg-top:#e9eef2; --bg-bot:#c9d3db;
  --panel:rgba(255,255,255,.9); --ink:#1c2630; --muted:#5a6672; --line:rgba(28,38,48,.16);
  --accent:#1f5f8b; --accent-ink:#ffffff; --danger:#a63a2b;
  --ground:#d7dee4; --road:#a9b3bc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-top:#151c24; --bg-bot:#0b1015;
    --panel:rgba(22,29,37,.92); --ink:#e7edf2; --muted:#9aa7b3; --line:rgba(231,237,242,.18);
    --accent:#72b5e2; --accent-ink:#0a1117; --danger:#ee8a7a;
    --ground:#1d2630; --road:#2c3640;
  }
}
:root[data-theme="dark"]{
  --bg-top:#151c24; --bg-bot:#0b1015;
  --panel:rgba(22,29,37,.92); --ink:#e7edf2; --muted:#9aa7b3; --line:rgba(231,237,242,.18);
  --accent:#72b5e2; --accent-ink:#0a1117; --danger:#ee8a7a;
  --ground:#1d2630; --road:#2c3640;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
[hidden]{ display:none !important; }
html,body{ height:100%; margin:0; }
body{
  background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));
  color:var(--ink); font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
#stage{ position:relative; width:100%; height:100%; }
canvas#c{ display:block; width:100%; height:100%; touch-action:none; outline:none; }
canvas#c:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
button,input,select,textarea{ font:inherit; color:inherit; }
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{ outline:2px solid var(--accent); outline-offset:2px; }
svg.i{ width:22px; height:22px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

/* ---------- barra in alto ---------- */
.glass{ background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
.topbar{ position:absolute; top:8px; left:8px; right:8px; z-index:3; display:flex; align-items:center; gap:6px; padding:6px; border-radius:16px; }
.brand{ display:none; font-weight:700; font-size:14px; padding:0 8px 0 6px; white-space:nowrap; }
.spacer{ flex:1; }
.seg{ display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.seg button{ display:flex; align-items:center; gap:6px; height:40px; padding:0 12px; border:0; border-right:1px solid var(--line); background:transparent; cursor:pointer; font-size:13px; font-weight:600; }
.seg button:last-child{ border-right:0; }
.seg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }
.lbl{ display:none; }
.ib{ display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; min-width:40px; padding:0 10px; border:1px solid var(--line); border-radius:12px; background:transparent; cursor:pointer; font-size:13px; font-weight:600; }
.ib:disabled{ opacity:.35; cursor:default; }
.ib[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.ib.sm{ height:32px; min-width:32px; padding:0 6px; border-radius:9px; }
@media (min-width:480px){ .ib .lbl{ display:inline; } }
@media (min-width:640px){ .seg .lbl{ display:inline; } }
@media (min-width:860px){ .brand{ display:block; } }

/* ---------- menu opzioni ---------- */
.menu{ position:absolute; top:62px; right:8px; z-index:5; width:min(300px,calc(100% - 16px)); max-height:calc(100% - 80px); overflow:auto; padding:8px 12px 12px; border-radius:16px; }
.mrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer; }
.mrow input{ width:22px; height:22px; margin:0; accent-color:var(--accent); }
.mgrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
.btn{ min-height:42px; padding:8px 10px; border:1px solid var(--line); border-radius:11px; background:transparent; cursor:pointer; font-size:13.5px; font-weight:600; }
.btn.danger{ color:var(--danger); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn:disabled{ opacity:.4; }
.note{ margin:10px 0 0; font-size:12.5px; color:var(--muted); line-height:1.4; }

/* ---------- strumenti ---------- */
.dock{ position:absolute; z-index:3; left:8px; top:62px; display:flex; flex-direction:column; gap:4px; padding:6px; border-radius:16px; max-height:calc(100% - 130px); overflow-y:auto; }
.tl{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; width:66px; height:58px; padding:0; border:0; border-radius:11px; background:transparent; cursor:pointer; font-size:10.5px; font-weight:600; line-height:1.1; text-align:center; flex:none; }
.tl[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }
.sep{ flex:none; height:1px; margin:3px 8px; background:var(--line); }
@media (max-width:719px){
  .dock{ top:auto; bottom:8px; left:8px; right:8px; flex-direction:row; align-items:center; overflow-x:auto; overflow-y:hidden; max-height:none; }
  .sep{ width:1px; height:34px; margin:0 3px; }
}

/* ---------- scheda proprietà ---------- */
.sheet{ position:absolute; z-index:4; right:8px; top:62px; width:min(330px,calc(100% - 16px)); max-height:calc(100% - 130px); overflow:auto; border-radius:16px; padding:0 14px 14px; }
.shead{ position:sticky; top:0; display:flex; align-items:center; gap:6px; padding:10px 0 8px; background:inherit; backdrop-filter:inherit; -webkit-backdrop-filter:inherit; z-index:1; }
.shead .pt{ flex:1; margin:0; font-size:15px; font-weight:700; }
.sheet[data-collapsed="1"] #props{ display:none; }
@media (max-width:719px){
  .sheet{ right:8px; left:8px; top:auto; bottom:80px; width:auto; max-height:46vh; }
}
.fld{ display:grid; grid-template-columns:1fr 132px; align-items:center; gap:10px; margin:8px 0; font-size:14px; }
.fld input,.fld select{ width:100%; min-height:40px; padding:6px 10px; border:1px solid var(--line); border-radius:10px; background:transparent; }
.fld select option{ color:#1c2630; background:#fff; }
.sl{ margin:14px 0 6px; font-size:12px; font-weight:700; color:var(--muted); }
.sws{ display:flex; flex-wrap:wrap; gap:9px; }
.swb{ position:relative; width:32px; height:32px; padding:0; border-radius:50%; border:2px solid var(--line); cursor:pointer; overflow:hidden; }
.swb[aria-pressed="true"]{ outline:3px solid var(--accent); outline-offset:2px; }
.swb.custom{ background:conic-gradient(#e33,#ec3,#3c5,#3ce,#33e,#c3e,#e33); }
.swb.custom input{ position:absolute; inset:-6px; width:44px; height:44px; opacity:0; cursor:pointer; }
.tex{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.tx{ position:relative; height:62px; padding:0; border:2px solid var(--line); border-radius:11px; background-size:cover; background-position:center; cursor:pointer; overflow:hidden; background-color:transparent; }
.tx span{ position:absolute; left:0; right:0; bottom:0; padding:2px 3px 3px; font-size:10.5px; font-weight:700; color:#fff; background:rgba(15,20,26,.62); text-align:center; line-height:1.15; }
.tx[aria-pressed="true"]{ border-color:var(--accent); outline:3px solid var(--accent); outline-offset:1px; }
.tx.none{ display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--muted); }
.acts{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.acts .btn{ flex:1 1 auto; }

.segs{ display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.segs button{ flex:1; height:38px; border:0; border-right:1px solid var(--line); background:transparent; cursor:pointer; font-size:13px; font-weight:600; }
.segs button:last-child{ border-right:0; }
.segs button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }

/* ---------- varie ---------- */
.hint{ position:absolute; z-index:2; left:12px; right:12px; bottom:12px; margin:0 auto; width:max-content; max-width:calc(100% - 24px); padding:9px 16px; border-radius:999px; font-size:13px; color:var(--muted); text-align:center; pointer-events:none; background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
@media (max-width:719px){ .hint{ bottom:auto; top:64px; } }
.walkui{ display:none; }
.walkui[data-on="1"]{ display:block; }
.joy{ display:none; position:absolute; left:18px; bottom:72px; width:120px; height:120px; border-radius:50%; background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); touch-action:none; }
.joy .knob{ position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px; border-radius:50%; background:var(--accent); opacity:.9; }
@media (pointer:coarse){ .walkui[data-on="1"] .joy{ display:block; } }
.mm{ position:absolute; right:12px; bottom:64px; width:240px; height:116px; border-radius:12px; border:1px solid var(--line); background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); cursor:crosshair; touch-action:none; }
.where{ position:absolute; right:12px; top:64px; padding:7px 14px; border-radius:999px; font-size:13px; font-weight:600; background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); pointer-events:none; }
@media (max-width:520px){ .mm{ width:190px; height:92px; } .where{ top:auto; bottom:164px; } }

#dlg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.35); padding:16px; z-index:8; }
#dlg .box{ width:min(560px,100%); border-radius:16px; padding:14px; }
#dlg h2{ margin:0 0 6px; font-size:15px; }
#dlg textarea{ width:100%; height:220px; resize:vertical; border:1px solid var(--line); border-radius:10px; background:transparent; padding:8px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
#dlg .acts .btn{ flex:1; }
</style>
</head>
<body>
<template id="body-src"><div id="stage">
  <canvas id="c" tabindex="0" aria-label="Modello 3D dell’appartamento"></canvas>

  <header class="topbar glass">
    <div class="brand">Via Verona</div>
    <div class="seg" role="group" aria-label="Modalità di visualizzazione">
      <button type="button" data-mode="orbit" aria-pressed="true" aria-label="Prospettiva" title="Prospettiva">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg><span class="lbl">Prospettiva</span></button>
      <button type="button" data-mode="plan" aria-pressed="false" aria-label="Pianta" title="Pianta">
        <svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"></rect><path d="M4 13h8V4M12 13v7M16 13h4"></path></svg><span class="lbl">Pianta</span></button>
      <button type="button" data-mode="walk" aria-pressed="false" aria-label="Passeggiata" title="Passeggiata">
        <svg class="i" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"></circle><path d="M13 8v5l-3 7M13 13l3.5 7M9 11l4-3 4 3"></path></svg><span class="lbl">Passeggiata</span></button>
    </div>
    <div class="spacer"></div>
    <button type="button" class="ib edit-only" id="undo" aria-label="Annulla" title="Annulla" hidden="">
      <svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
    <button type="button" class="ib edit-only" id="redo" aria-label="Ripeti" title="Ripeti" hidden="">
      <svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 0 0 0 12h3"></path></svg></button>
    <button type="button" class="ib" id="btnEdit" aria-pressed="false" title="Modifica la casa">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"></path><path d="M14 7l3 3"></path></svg><span class="lbl" id="editLbl">Modifica</span></button>
    <button type="button" class="ib" id="btnMenu" aria-haspopup="true" aria-expanded="false" aria-label="Opzioni" title="Opzioni">
      <svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2" fill="currentColor"></circle><circle cx="12" cy="12" r="1.2" fill="currentColor"></circle><circle cx="19" cy="12" r="1.2" fill="currentColor"></circle></svg></button>
  </header>

  <div class="menu glass" id="menu" hidden="">
    <label class="mrow"><span>Nomi delle stanze</span><input type="checkbox" id="optLabels" checked=""></label>
    <label class="mrow"><span>Pareti basse</span><input type="checkbox" id="optLow"></label>
    <div id="dlbox" style="padding:12px 0 6px;border-bottom:1px solid var(--line)">
      <button type="button" class="btn primary" id="dlfile" style="width:100%">Scarica il file HTML</button>
      <label class="opt" style="display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px;cursor:pointer"><input type="checkbox" id="optViewOnly" style="width:20px;height:20px;margin:0;accent-color:var(--accent)"> <span>Solo da guardare, senza gli strumenti di modifica</span></label>
      <p class="note" style="margin-top:8px">È un unico file da allegare a una mail: chi lo riceve lo apre col browser, senza accedere a Claude. Serve una connessione a internet.</p>
    </div>
    <label class="mrow edit-only" hidden=""><span>Aggancio alla griglia</span><input type="checkbox" id="optSnap" checked=""></label>
    <label class="mrow edit-only" hidden=""><span>Allunga i muri collegati</span><input type="checkbox" id="optLink" checked=""></label>
    <div class="edit-only" hidden="" style="margin-top:12px">
      <button type="button" class="btn primary" id="saveFile" style="width:100%">Salva nella piantina condivisa</button>
      <p class="note" id="fileNote" style="margin-top:8px"></p>
    </div>
    <div class="mgrid edit-only" hidden="">
      <button type="button" class="btn" id="save">Salva ora</button>
      <button type="button" class="btn" id="export">Esporta file</button>
      <button type="button" class="btn" id="import">Importa file</button>
      <button type="button" class="btn" id="text">Testo</button>
      <button type="button" class="btn danger" id="reset" style="grid-column:1 / -1">Ripristina l’originale</button>
    </div>
    <p class="note edit-only" id="status" hidden=""></p>
    <input type="file" id="file" accept=".json,application/json" hidden="">
  </div>

  <nav class="dock glass edit-only" id="dock" aria-label="Strumenti di modifica" hidden=""></nav>

  <aside class="sheet glass" id="sheet" data-collapsed="0" hidden="">
    <div class="shead">
      <p class="pt" id="stitle"></p>
      <button type="button" class="ib sm" id="scollapse" aria-label="Riduci la scheda" title="Riduci"><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button type="button" class="ib sm" id="sclose" aria-label="Chiudi la scheda" title="Chiudi"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div id="props"></div>
  </aside>

  <div class="walkui" id="walkui" data-on="0">
    <div class="joy" id="joy" aria-label="Joystick di movimento"><div class="knob" id="knob"></div></div>
    <canvas class="mm" id="mm" width="480" height="232" aria-label="Mappa: tocca per spostarti"></canvas>
    <div class="where" id="where" aria-live="polite"></div>
  </div>
  <p class="hint" id="hint"></p>

  <div id="dlg" hidden="">
    <div class="box glass" role="dialog" aria-modal="true" aria-labelledby="dlgt">
      <h2 id="dlgt">Dati della piantina</h2>
      <p class="note" style="margin:0 0 8px">Copia il testo per conservarlo, oppure incolla qui una piantina salvata e premi Applica.</p>
      <textarea id="dlgtext" spellcheck="false"></textarea>
      <div class="acts">
        <button type="button" class="btn" id="dlgcopy">Copia</button>
        <button type="button" class="btn" id="dlgapply">Applica</button>
        <button type="button" class="btn" id="dlgclose">Chiudi</button>
      </div>
    </div>
  </div>
</div></template>

function worldUV(mesh, tile){
  const tiles = Array.isArray(tile) ? tile : [tile,tile,tile,tile,tile,tile];
  const g = mesh.geometry, pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv;
  const ox = mesh.position.x, oy = mesh.position.y, oz = mesh.position.z;
  for (let f=0; f<6; f++){
    const t = tiles[f]; if (!t) continue;
    for (let i=f*4; i<f*4+4; i++){

      let u, v;
      if (Math.abs(nor.getY(i)) > .5){ u = x; v = z; }

const okCol = c => (typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c)) ? c.toLowerCase() : undefined;

function normalize(p){
  const num = v => (typeof v === 'number' && isFinite(v));
  const out = { v:1, walls:[], columns:[], floors:[], rails:[], labels:[] };
  (p.walls || []).forEach(w => {
    if (![w.x1,w.y1,w.x2,w.y2].every(num)) return;
    let x1 = w.x1, y1 = w.y1, x2 = w.x2, y2 = w.y2;
    if (Math.abs(x2-x1) >= Math.abs(y2-y1)) y2 = y1; else x2 = x1;
    if (Math.abs(x2-x1) + Math.abs(y2-y1) < 0.5) return;
    out.walls.push({ id:w.id || uid(), x1:Math.min(x1,x2), y1:Math.min(y1,y2), x2:Math.max(x1,x2), y2:Math.max(y1,y2),
      k:w.k === 'e' ? 'e' : 'i', col:okCol(w.col), tx:okTex(w.tx), sa:normSide(w.sa), sb:normSide(w.sb),
      ops:(w.ops || []).filter(o => num(o.p) && num(o.w)).map(o => ({ p:o.p, w:Math.max(6,o.w),
        t:['door','win','pf','open'].indexOf(o.t) >= 0 ? o.t : 'door', s:o.s === -1 ? -1 : 1 })) });
  });
  (p.columns || []).forEach(c => {
    if (![c.x0,c.x1,c.y0,c.y1].every(num)) return;
    out.columns.push({ col:okCol(c.col), tx:okTex(c.tx), id:c.id || uid(), x0:Math.min(c.x0,c.x1), x1:Math.max(c.x0,c.x1), y0:Math.min(c.y0,c.y1), y1:Math.max(c.y0,c.y1) });
  });
  (p.floors || []).forEach(f => {
    if (!Array.isArray(f.pts) || f.pts.length < 3 || !f.pts.every(q => Array.isArray(q) && num(q[0]) && num(q[1]))) return;
    out.floors.push({ id:f.id || uid(), name:String(f.name || ''), m:(FLOORS[f.m] || f.m === 'colore') ? f.m : 'parquet', col:okCol(f.col), pts:f.pts.map(q => [q[0],q[1]]) });
  });
  (p.rails || []).forEach(r => {
    if (!Array.isArray(r.pts) || r.pts.length < 2 || !r.pts.every(q => Array.isArray(q) && num(q[0]) && num(q[1]))) return;
    out.rails.push({ id:r.id || uid(), kind:(r.kind === 'glazed' || r.kind === 'fence') ? r.kind : 'rail', h:(typeof r.h === 'number' && isFinite(r.h)) ? clamp(r.h, .3, 2) : undefined, col:okCol(r.col), tx:okTex(r.tx), sa:normSide(r.sa), sb:normSide(r.sb), pts:r.pts.map(q => [q[0],q[1]]) });
  });

    if (!num(l.x) || !num(l.y)) return;

}

/* ------------------------- Costruzione della scena dal modello ------------------------- */
function buildFloor(f){
  const m = FLOORS[f.m] || FLOORS.parquet;
  const top = f.top !== undefined ? f.top : (m.top !== undefined ? m.top : .06), bottom = -0.02;
  const sh = new THREE.Shape();
  f.pts.forEach((p,i) => { const x = X(p[0]), y = -Z(p[1]); if (i === 0) sh.moveTo(x,y); else sh.lineTo(x,y); });
  const g = new THREE.ExtrudeGeometry(sh, { depth: top - bottom, bevelEnabled:false });
  g.rotateX(-Math.PI/2);
  const mesh = new THREE.Mesh(g, floorMatFor(f));
  mesh.position.y = bottom; mesh.receiveShadow = true;
  floorsG.add(mesh);
}

function buildWall(w){
  const t = wallT(w), horiz = isH(w);
  const c = horiz ? w.y1 : w.x1;
  const a = horiz ? w.x1 : w.y1, b = horiz ? w.x2 : w.y2;
  if (b - a < 0.5) return;
  /* lato a = nord (muro orizzontale) o ovest (verticale); lato b = sud o est */
  const sa = w.sa || { col:w.col, tx:w.tx }, sb = w.sb || { col:w.col, tx:w.tx };
  const mE = finishMat(w.col, w.tx), mA = finishMat(sa.col, sa.tx), mB = finishMat(sb.col, sb.tx);
  const tE = tileOf(w.tx), tA = tileOf(sa.tx), tB = tileOf(sb.tx);
  const wm  = horiz ? [mE,mE,wallTop,mE,mB,mA] : [mB,mA,wallTop,mE,mE,mE];
  const uvT = horiz ? [tE,tE,0,0,tB,tA]       : [tB,tA,0,0,tE,tE];

  const ops = (w.ops || []).map(o => Object.assign({}, o, { lo:o.p - o.w/2, hi:o.p + o.w/2 }))
    .filter(o => o.lo >= a - 0.01 && o.hi <= b + 0.01).sort((p,q) => p.lo - q.lo);
  const iv = []; let last = -Infinity;
  ops.forEach(o => { if (o.lo >= last - 0.01){ iv.push(o); last = o.hi; } });

  const part = (lo,hi,h0,h1,th,m,solid) => {
    const ut = (m === wm) ? uvT : 0;
    if (horiz){
      box(lo,hi,c-th/2,c+th/2,h0,h1,m,wallsG, solid !== false, true, ut);
      if (solid === true && h0 === 0) collide(lo,hi,c-th/2,c+th/2);
    } else {
      box(c-th/2,c+th/2,lo,hi,h0,h1,m,wallsG, solid !== false, true, ut);
      if (solid === true && h0 === 0) collide(c-th/2,c+th/2,lo,hi);
    }
  };
  const solidPiece = (lo,hi,h0,h1) => { if (hi - lo > 0.01) part(lo,hi,h0,h1,t,wm,true); };
  const lintel = (lo,hi,h0,h1) => part(lo,hi,h0,h1,t,wm,'nocol');

  const frame = (lo,hi,h0,h1) => {
    const ft = 3, fw = 1.6;
    part(lo,lo+fw,h0,h1,ft,frameMat,false);
    part(hi-fw,hi,h0,h1,ft,frameMat,false);
    part(lo,hi,h1-0.05,h1,ft,frameMat,false);
    if (h0 > 0) part(lo,hi,h0,h0+0.05,ft,frameMat,false);
    const mid = (lo+hi)/2;
    part(mid-fw/2,mid+fw/2,h0,h1,ft,frameMat,false);
    if (horiz) box(lo+fw,hi-fw,c-0.35,c+0.35,h0,h1,glassMat,wallsG,false,false);
    else box(c-0.35,c+0.35,lo+fw,hi-fw,h0,h1,glassMat,wallsG,false,false);
  };
  const leaf = o => {
    const lw = (o.hi - o.lo) * S - 0.03;
    const grp = new THREE.Group();
    let geo, off;
    if (horiz){ geo = new THREE.BoxGeometry(lw, 2.05, 0.04); off = [lw/2, 1.025, 0]; grp.position.set(X(o.lo), 0, Z(c)); }
    else      { geo = new THREE.BoxGeometry(0.04, 2.05, lw); off = [0, 1.025, lw/2]; grp.position.set(X(c), 0, Z(o.lo)); }
    const m = new THREE.Mesh(geo, doorMat);
    m.position.set(off[0], off[1], off[2]); m.castShadow = true; m.receiveShadow = true;
    grp.add(m); grp.rotation.y = 1.25 * (o.s || 1);
    wallsG.add(grp);
  };

  let cur = a - t/2;
  iv.forEach(o => {
    solidPiece(cur, o.lo, 0, H);
    cur = o.hi;
    if (o.t === 'win'){ solidPiece(o.lo, o.hi, 0, SILL); lintel(o.lo, o.hi, HEAD, H); frame(o.lo, o.hi, SILL, HEAD); }
    else if (o.t === 'pf'){ lintel(o.lo, o.hi, HEAD, H); frame(o.lo, o.hi, 0, HEAD); }
    else if (o.t === 'door'){ lintel(o.lo, o.hi, HEAD, H); leaf(o); }
    else { lintel(o.lo, o.hi, HEAD, H); }
  });

}

function buildColumn(c){
  box(c.x0,c.x1,c.y0,c.y1,0,H,wallMatsFor(c.col,c.tx),wallsG,true,true,c.tx ? TEXDEF[c.tx].tile : 0);

function buildRail(r){
  const t = 8;
  for (let i=0; i<r.pts.length-1; i++){
    const a = r.pts[i], b = r.pts[i+1];
    const horiz = Math.abs(b[1]-a[1]) <= Math.abs(b[0]-a[0]);
    /* lato a = nord/ovest, lato b = sud/est */
    const ra = r.sa || { col:r.col, tx:r.tx }, rb = r.sb || { col:r.col, tx:r.tx };
    const rE = finishMatD(r.col, r.tx, parSide), rA = finishMatD(ra.col, ra.tx, parSide), rB = finishMatD(rb.col, rb.tx, parSide);
    const rM  = horiz ? [rE,rE,parTop,rE,rB,rA] : [rB,rA,parTop,rE,rE,rE];
    const rUV = horiz ? [tileOf(r.tx),tileOf(r.tx),0,0,tileOf(rb.tx),tileOf(ra.tx)] : [tileOf(rb.tx),tileOf(ra.tx),0,0,tileOf(r.tx),tileOf(r.tx)];
    if (r.kind === 'fence'){
      buildFence(r, a, b, horiz);
    } else if (r.kind === 'glazed'){
      const sill = 0.9, pitchPx = 40;
      const lo = (horiz ? Math.min(a[0],b[0]) : Math.min(a[1],b[1])) - t/2;
      const hi = (horiz ? Math.max(a[0],b[0]) : Math.max(a[1],b[1])) + t/2;
      const c = horiz ? a[1] : a[0];
      const put = (p,q,h0,h1,th,m,cast,recv,uv) => horiz
        ? box(p,q,c-th/2,c+th/2,h0,h1,m,wallsG,cast,recv,uv) : box(c-th/2,c+th/2,p,q,h0,h1,m,wallsG,cast,recv,uv);
      put(lo,hi,0,sill,5,rM,true,true,rUV);
      if (horiz) collide(lo,hi,c-2.5,c+2.5); else collide(c-2.5,c+2.5,lo,hi);
      put(lo,hi,sill,H,0.7,glassMat,false,false);
      put(lo,hi,sill,sill+0.05,3,frameMat,false,true);
      put(lo,hi,H-0.06,H,3,frameMat,false,true);
      const n = Math.max(1, Math.round((hi-lo)/pitchPx));

/* Ringhiera: corrimano, montanti, traverso e sbarre (le sbarre sono una texture con trasparenza) */
const metalCache = {}, barMatCache = {};
function metalMat(c){ return metalCache[c] || (metalCache[c] = mat(c, { roughness:.45, metalness:.35 })); }
let barTexture = null;
function barMat(c){
  if (!barTexture){
    const cv = document.createElement('canvas'); cv.width = 16; cv.height = 16;
    const g = cv.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(6, 0, 4, 16);
    barTexture = toTex(cv);
  }
  return barMatCache[c] || (barMatCache[c] = new THREE.MeshStandardMaterial({ color:c, map:barTexture, alphaTest:.5, side:THREE.DoubleSide, roughness:.45, metalness:.35 }));
}
function buildFence(r, a, b, horiz){
  const h = clamp(r.h || 1.0, .4, 1.6), col = r.col || '#3b4048';
  const mm = metalMat(col), bm = barMat(col);
  const c = horiz ? a[1] : a[0];
  const lo = horiz ? Math.min(a[0],b[0]) : Math.min(a[1],b[1]), hi = horiz ? Math.max(a[0],b[0]) : Math.max(a[1],b[1]);
  if (hi - lo < 1) return;
  const put = (p,q,h0,h1,th) => horiz ? box(p,q,c-th/2,c+th/2,h0,h1,mm,floorsG,true,true) : box(c-th/2,c+th/2,p,q,h0,h1,mm,floorsG,true,true);
  put(lo-1, hi+1, h-0.05, h, 2.4);      // corrimano
  put(lo-1, hi+1, 0.06, 0.11, 1.6);     // traverso basso
  const n = Math.max(1, Math.round((hi-lo)/30));
  for (let k=0; k<=n; k++){ const q = lo + k*(hi-lo)/n; put(q-0.8, q+0.8, 0, h, 1.6); }
  const lenM = (hi-lo)*S, ph = h - 0.16;
  const pg = new THREE.PlaneGeometry(lenM, ph), uv = pg.attributes.uv;
  for (let i=0; i<uv.count; i++) uv.setX(i, uv.getX(i) * lenM / 0.13);
  const pm = new THREE.Mesh(pg, bm);
  const mid = (lo+hi)/2;
  if (horiz) pm.position.set(X(mid), 0.11 + ph/2, Z(c));
  else { pm.position.set(X(c), 0.11 + ph/2, Z(mid)); pm.rotation.y = Math.PI/2; }
  floorsG.add(pm);
  if (horiz) collide(lo-1, hi+1, c-1.5, c+1.5); else collide(c-1.5, c+1.5, lo-1, hi+1);
}

const RADIUS = 0.22;
const toPx = (x,z) => [x/S + CX, z/S + CY];

function pointInPoly(x, y, pts){
  let inside = false;
  for (let i=0, j=pts.length-1; i<pts.length; j=i++){
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function roomAt(x,z){
  const p = toPx(x,z);
  for (let i = plan.floors.length - 1; i >= 0; i--){
    const f = plan.floors[i];
    if (f.name && pointInPoly(p[0], p[1], f.pts)) return f.name;
  }
  return 'Esterno';
}

function resolve(nx, nz){
  for (let it=0; it<4; it++){
    for (const b of colliders){
      const cx = clamp(nx, b.x0, b.x1), cz = clamp(nz, b.z0, b.z1);
      const ex = nx - cx, ez = nz - cz, d2 = ex*ex + ez*ez;
      if (d2 < RADIUS*RADIUS){
        if (d2 > 1e-9){ const d = Math.sqrt(d2); nx = cx + ex/d*RADIUS; nz = cz + ez/d*RADIUS; }
        else {
          const dl = nx-b.x0, dr = b.x1-nx, du = nz-b.z0, dd = b.z1-nz, mn = Math.min(dl,dr,du,dd);
          if (mn === dl) nx = b.x0 - RADIUS; else if (mn === dr) nx = b.x1 + RADIUS;
          else if (mn === du) nz = b.z0 - RADIUS; else nz = b.z1 + RADIUS;
        }
      }
    }
  }
  return [clamp(nx, X(-120), X(820)), clamp(nz, Z(30), Z(440))];
}
function blocked(x,z){
  for (const b of colliders){
    const cx = clamp(x,b.x0,b.x1), cz = clamp(z,b.z0,b.z1);
    if ((x-cx)*(x-cx)+(z-cz)*(z-cz) < (RADIUS-0.02)*(RADIUS-0.02)) return true;
  }
  return false;
}

const joy = { x:0, y:0 };

let bob = 0, dragging = false, lx = 0, ly = 0;

function look(dx, dy, k){

  pitch = clamp(pitch - dy * k, -1.25, 1.25);

}

/* Mappa */
const mm = $('mm'), mctx = mm.getContext('2d');
const whereEl = $('where');
const MB = { x0:36, y0:30, x1:696, y1:360 };
function mmScale(){ return Math.min(mm.width/(MB.x1-MB.x0), mm.height/(MB.y1-MB.y0)); }
function drawMap(){
  const W = mm.width, Hh = mm.height, sc = mmScale();
  const ox = (W - (MB.x1-MB.x0)*sc)/2, oy = (Hh - (MB.y1-MB.y0)*sc)/2;
  const mx = px => ox + (px - MB.x0)*sc, my = py => oy + (py - MB.y0)*sc;
  const ink = cssVar('--ink') || '#1c2630', acc = cssVar('--accent') || '#1f5f8b';
  mctx.clearRect(0,0,W,Hh);
  mctx.globalAlpha = .1; mctx.fillStyle = ink;
  plan.floors.forEach(f => {
    mctx.beginPath();
    f.pts.forEach((p,i) => { if (i === 0) mctx.moveTo(mx(p[0]), my(p[1])); else mctx.lineTo(mx(p[0]), my(p[1])); });
    mctx.closePath(); mctx.fill();
  });
  mctx.globalAlpha = .85;
  for (const b of colliders){
    const a = toPx(b.x0,b.z0), c = toPx(b.x1,b.z1);
    mctx.fillRect(mx(a[0]), my(a[1]), Math.max(1.2,(c[0]-a[0])*sc), Math.max(1.2,(c[1]-a[1])*sc));
  }
  mctx.globalAlpha = 1;
  const pp = toPx(camera.position.x, camera.position.z);
  const cx = mx(pp[0]), cy = my(pp[1]), fx = -Math.sin(yaw), fz = -Math.cos(yaw), a = Math.atan2(fz,fx);
  mctx.fillStyle = acc; mctx.globalAlpha = .28;
  mctx.beginPath(); mctx.moveTo(cx,cy); mctx.arc(cx,cy,34,a-0.6,a+0.6); mctx.closePath(); mctx.fill();
  mctx.globalAlpha = 1; mctx.beginPath(); mctx.arc(cx,cy,6,0,7); mctx.fill();
}
mm.addEventListener('pointerdown', e => {
  if (mode !== 'walk') return;
  const r = mm.getBoundingClientRect(), sc = mmScale(), k = mm.width / r.width;
  const ox = (mm.width - (MB.x1-MB.x0)*sc)/2, oy = (mm.height - (MB.y1-MB.y0)*sc)/2;
  const px = MB.x0 + ((e.clientX - r.left)*k - ox)/sc, py = MB.y0 + ((e.clientY - r.top)*k - oy)/sc;
  const x = X(px), z = Z(py);
  if (!blocked(x,z)){ camera.position.x = x; camera.position.z = z; vel.x = vel.z = 0; }
});

function walk(dt){
  const turn = (keys.tr?1:0) - (keys.tl?1:0);
  if (turn){ yaw -= turn * 1.8 * dt; applyLook(); }
  let f = (keys.f?1:0) - (keys.b?1:0) - joy.y;
  let r = (keys.r?1:0) - (keys.l?1:0) + joy.x;
  const len = Math.hypot(f,r); if (len > 1){ f /= len; r /= len; }
  const speed = keys.shift ? 4.0 : 2.0;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  const tx = (fx*f + rx*r) * speed, tz = (fz*f + rz*r) * speed;
  const k = 1 - Math.exp(-dt * 11);
  vel.x += (tx - vel.x) * k; vel.z += (tz - vel.z) * k;
  const dist = Math.hypot(vel.x, vel.z) * dt;
  if (dist > 1e-5){
    const steps = Math.max(1, Math.ceil(dist / 0.08));
    for (let i=0; i<steps; i++){
      const p = resolve(camera.position.x + vel.x*dt/steps, camera.position.z + vel.z*dt/steps);
      camera.position.x = p[0]; camera.position.z = p[1];
    }
  }
  const sp = Math.hypot(vel.x, vel.z);
  bob += sp * dt * 3.4;
  camera.position.y = EYE + (sp > .25 ? Math.sin(bob) * 0.012 * Math.min(1, sp/2) : 0);
  drawMap();
  const name = roomAt(camera.position.x, camera.position.z);
  if (whereEl.textContent !== name) whereEl.textContent = name;
}

/* ---------- geometria 2D ---------- */
function segDist(px,py,x1,y1,x2,y2){
  const dx = x2-x1, dy = y2-y1, l2 = dx*dx + dy*dy;
  let t = l2 ? ((px-x1)*dx + (py-y1)*dy) / l2 : 0; t = clamp(t,0,1);
  return Math.hypot(px - (x1+t*dx), py - (y1+t*dy));
}
function polyArea(pts){ let a = 0; for (let i=0,j=pts.length-1;i<pts.length;j=i++) a += (pts[j][0]+pts[i][0])*(pts[j][1]-pts[i][1]); return Math.abs(a/2); }
function isRectPts(pts){
  if (pts.length !== 4) return false;
  const xs = [...new Set(pts.map(p => Math.round(p[0]*100)))], ys = [...new Set(pts.map(p => Math.round(p[1]*100)))];
  return xs.length === 2 && ys.length === 2;
}

/* ---------- puntatore sulla pianta ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), gplane = new THREE.Plane(new THREE.Vector3(0,1,0),0), hitV = new THREE.Vector3();
function ground(e){
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(gplane, hitV)) return null;
  return [hitV.x/S + CX, hitV.z/S + CY];
}
function tolPx(){
  const d = Math.max(2, camera.position.distanceTo(controls.target));
  const wpp = 2*d*Math.tan(camera.fov*Math.PI/360) / Math.max(1, canvas.clientHeight);
  return clamp(10*wpp/S, 2, 60);
}

/* ---------- aggancio ---------- */
function guides(ex){
  const xs = [], ys = [];
  plan.walls.forEach(w => { if (w.id === ex) return; xs.push(w.x1,w.x2); ys.push(w.y1,w.y2); });
  plan.columns.forEach(c => { if (c.id === ex) return; xs.push(c.x0,c.x1); ys.push(c.y0,c.y1); });
  plan.floors.forEach(f => { if (f.id === ex) return; f.pts.forEach(p => { xs.push(p[0]); ys.push(p[1]); }); });
  return { xs:xs, ys:ys };
}
function snap1(v, arr, tol){
  let b = null, bd = tol;
  for (const a of arr){ const d = Math.abs(a - v); if (d < bd){ bd = d; b = a; } }
  if (b !== null) return b;
  return opt.snap ? Math.round(v/GRID)*GRID : v;
}
function snapDelta(vals, d, arr, tol){
  let best = null, bd = tol;
  for (const v of vals) for (const a of arr){
    const dd = a - (v + d);
    if (Math.abs(dd) < bd){ bd = Math.abs(dd); best = d + dd; }
  }
  if (best !== null) return best;
  if (opt.snap) return Math.round((vals[0] + d)/GRID)*GRID - vals[0];
  return d;
}

/* ---------- selezione ---------- */
function selItem(){
  if (!sel) return null;
  if (sel.type === 'op'){
    const w = byId(plan.walls, sel.id); const o = w && w.ops[sel.i];
    return o ? { type:'op', wall:w, op:o, obj:o } : null;
  }
  const arr = { wall:plan.walls, column:plan.columns, floor:plan.floors, rail:plan.rails, label:plan.labels }[sel.type];
  const obj = arr && byId(arr, sel.id);

    if (px >= c.x0 - tol*.4 && px <= c.x1 + tol*.4 && py >= c.y0 - tol*.4 && py <= c.y1 + tol*.4) return { type:'column', id:c.id };

const undoS = [], redoS = [];

function undo(){ if (!undoS.length) return; redoS.push(JSON.stringify(plan)); plan = normalize(JSON.parse(undoS.pop())); afterHistory(); }
function redo(){ if (!redoS.length) return; undoS.push(JSON.stringify(plan)); plan = normalize(JSON.parse(redoS.pop())); afterHistory(); }
function mutate(fn){

}

function shiftItem(type, obj, dx, dy){

    obj.ops.forEach(o => { o.p += h ? dx : dy; });

  else if (type === 'column'){ obj.x0 += dx; obj.x1 += dx; obj.y0 += dy; obj.y1 += dy; }
  else if (type === 'floor' || type === 'rail'){ obj.pts.forEach(p => { p[0] += dx; p[1] += dy; }); }
  else if (type === 'label'){ obj.x += dx; obj.y += dy; }
}

}

    const key = { wall:'walls', column:'columns', floor:'floors', rail:'rails', label:'labels' }[it.type];
    const c = clone(it.obj); c.id = uid(); nid = c.id;

function attachedFor(w){
  const list = []; if (!opt.link) return list;
  const h = isH(w);
  plan.walls.forEach(b => {
    if (b.id === w.id || isH(b) === h) return;
    if (h){
      if (b.x1 < w.x1 - 1.5 || b.x1 > w.x2 + 1.5) return;
      if (Math.abs(b.y1 - w.y1) <= 1.5) list.push({ id:b.id, key:'y1', orig:b.y1 });
      if (Math.abs(b.y2 - w.y1) <= 1.5) list.push({ id:b.id, key:'y2', orig:b.y2 });

    const cx = opt.snap ? Math.round(p[0]/GRID)*GRID : p[0], cy = opt.snap ? Math.round(p[1]/GRID)*GRID : p[1];
    const c = { id:uid(), x0:cx-5, x1:cx+5, y0:cy-5, y1:cy+5 };
    plan.columns.push(c); pushUndo(before); rebuild(); setTool('select'); setSel({ type:'column', id:c.id }); return;
  }
  if (tool === 'label'){
    const l = { id:uid(), text:'Stanza', x:p[0], y:p[1], w:1.4, g:0 };
    plan.labels.push(l); pushUndo(before); rebuild(); setTool('select'); setSel({ type:'label', id:l.id }); return;
  }
  if (['door','win','pf','open'].indexOf(tool) < 0) return;
  let best = null, bd = Infinity;
  plan.walls.forEach(w => { const dd = segDist(p[0],p[1],w.x1,w.y1,w.x2,w.y2); if (dd <= wallT(w)/2 + tol*.8 && dd < bd){ bd = dd; best = w; } });
  if (!best){ flash('Clicca su un muro per inserirla.'); return; }
  const h = isH(best), a = h ? best.x1 : best.y1, b = h ? best.x2 : best.y2, c = h ? best.y1 : best.x1;
  const def = { door:24, win:28, pf:30, open:40 }[tool], w = Math.min(def, b - a - 2);
  if (w < 6){ flash('Il muro è troppo corto.'); return; }
  let pos = h ? p[0] : p[1]; if (opt.snap) pos = Math.round(pos/GRID)*GRID;
  pos = clamp(pos, a + w/2 + 1, b - w/2 - 1);
  if (best.ops.some(o => Math.abs(o.p - pos) < (o.w + w)/2)){ flash('C’è già un’apertura in questo punto.'); return; }
  const s = h ? (p[1] < c ? 1 : -1) : (p[0] > c ? 1 : -1);
  best.ops.push({ p:pos, w:w, t:tool, s:s });
  pushUndo(before); rebuild(); setSel({ type:'op', id:best.id, i:best.ops.length - 1 });
}

window.addEventListener('keydown', e => {
  if (!editing || typing(e.target)) return;
  const k = e.key, mod = e.ctrlKey || e.metaKey;
  if (mod && k.toLowerCase() === 'z'){ e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && k.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
  if (k === 'Delete' || k === 'Backspace'){ if (sel){ e.preventDefault(); deleteSel(); } return; }
  if (k === 'Escape'){ cancelInteraction(true); if (tool !== 'select') setTool('select'); else setSel(null); return; }
  if (k.indexOf('Arrow') === 0 && sel){
    e.preventDefault();
    const st = (e.shiftKey ? 4 : 1) * GRID;
    nudge(k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0);
  }
});

/* ---------- evidenziazioni 3D ---------- */
const ACC = 0x2f8fff, ORG = 0xff9f1a;
const ovMat = (c,o) => new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:o, depthTest:false, side:THREE.DoubleSide });
function ovBox(x0,x1,y0,y1,h0,h1,c,o){
  const m = new THREE.Mesh(new THREE.BoxGeometry((x1-x0)*S, h1-h0, (y1-y0)*S), ovMat(c,o));
  m.position.set(X((x0+x1)/2), (h0+h1)/2, Z((y0+y1)/2)); m.renderOrder = 20; editG.add(m);
}
function ovPoly(pts,c,o,y){
  const sh = new THREE.Shape();
  pts.forEach((p,i) => { const x = X(p[0]), yy = -Z(p[1]); if (i === 0) sh.moveTo(x,yy); else sh.lineTo(x,yy); });
  const g = new THREE.ShapeGeometry(sh); g.rotateX(-Math.PI/2);
  const m = new THREE.Mesh(g, ovMat(c,o)); m.position.y = y; m.renderOrder = 19; editG.add(m);
}
function ovHandle(x,y,c){
  const grp = new THREE.Group();
  const a = new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.06,24), ovMat(0xffffff,1)); a.renderOrder = 30;
  const b = new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.08,24), ovMat(c,1)); b.renderOrder = 31;
  grp.add(a,b); grp.position.set(X(x), .5, Z(y)); grp.userData.handle = true; editG.add(grp);
}
function drawOverlay(){
  clearGroup(editG, true);
  if (!editing) return;
  const it = selItem();
  if (it){
    const col = it.type === 'op' ? ORG : ACC;
    if (it.type === 'wall'){
      const w = it.obj, t = wallT(w) + 3;
      ovBox(w.x1 - t/2, w.x2 + t/2, w.y1 - t/2, w.y2 + t/2, 0, .34, ACC, .5);
      if (finishSide !== 'both'){
        const t2 = wallT(w), th = 3;
        if (isH(w)){ const y0 = finishSide === 'a' ? w.y1 - t2/2 - th : w.y1 + t2/2; ovBox(w.x1 - t2/2, w.x2 + t2/2, y0, y0 + th, 0, .42, ORG, .9); }
        else       { const x0 = finishSide === 'a' ? w.x1 - t2/2 - th : w.x1 + t2/2; ovBox(x0, x0 + th, w.y1 - t2/2, w.y2 + t2/2, 0, .42, ORG, .9); }
      }
    } else if (it.type === 'op'){
      const w = it.wall, o = it.op, h = isH(w), c = h ? w.y1 : w.x1, t = wallT(w) + 4;
      if (h) ovBox(o.p - o.w/2, o.p + o.w/2, c - t/2, c + t/2, 0, .4, ORG, .6);
      else   ovBox(c - t/2, c + t/2, o.p - o.w/2, o.p + o.w/2, 0, .4, ORG, .6);
    } else if (it.type === 'column'){
      const c = it.obj; ovBox(c.x0-1, c.x1+1, c.y0-1, c.y1+1, 0, .34, ACC, .5);
    } else if (it.type === 'floor'){
      ovPoly(it.obj.pts, ACC, .28, .12);
    } else if (it.type === 'rail'){
      const r = it.obj;
      for (let i=0; i<r.pts.length-1; i++){
        const a = r.pts[i], b = r.pts[i+1];
        const hz = Math.abs(b[1]-a[1]) <= Math.abs(b[0]-a[0]);
        if (hz) ovBox(Math.min(a[0],b[0])-5, Math.max(a[0],b[0])+5, a[1]-5, a[1]+5, 0, .34, ACC, .5);
        else ovBox(a[0]-5, a[0]+5, Math.min(a[1],b[1])-5, Math.max(a[1],b[1])+5, 0, .34, ACC, .5);
        if (finishSide !== 'both'){
          const th = 3, tt = 8;
          if (hz){ const y0 = finishSide === 'a' ? a[1] - tt/2 - th : a[1] + tt/2; ovBox(Math.min(a[0],b[0]) - tt/2, Math.max(a[0],b[0]) + tt/2, y0, y0 + th, 0, .42, ORG, .9); }
          else   { const x0 = finishSide === 'a' ? a[0] - tt/2 - th : a[0] + tt/2; ovBox(x0, x0 + th, Math.min(a[1],b[1]) - tt/2, Math.max(a[1],b[1]) + tt/2, 0, .42, ORG, .9); }
        }
      }
    } else if (it.type === 'label'){
      const l = it.obj, wp = labelWpx(l), hp = wp/4;
      ovBox(l.x - wp/2, l.x + wp/2, l.y - hp/2, l.y + hp/2, .1, .14, ACC, .3);
    }
    getHandles().forEach(h => ovHandle(h.x, h.y, col));
  }
  if (draft){
    if (draft.kind === 'rect'){
      const x0 = Math.min(draft.x0,draft.x1), x1 = Math.max(draft.x0,draft.x1), y0 = Math.min(draft.y0,draft.y1), y1 = Math.max(draft.y0,draft.y1);
      if (x1 > x0 && y1 > y0) ovPoly([[x0,y0],[x1,y0],[x1,y1],[x0,y1]], ACC, .35, .12);
    } else {
      const t = tool === 'wallE' ? 8 : tool === 'wallI' ? 4 : 8;
      ovBox(Math.min(draft.x0,draft.x1) - t/2, Math.max(draft.x0,draft.x1) + t/2, Math.min(draft.y0,draft.y1) - t/2, Math.max(draft.y0,draft.y1) + t/2, 0, .34, ACC, .6);
    }
  }
}

const propsEl = $('props'), sheetEl = $('sheet');
function el(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
function note(t){ return el('p','note',t); }
function section(t){ return el('p','sl',t); }
function fld(label, node){ const d = el('label','fld'); d.append(el('span', null, label), node); return d; }
function numIn(val, step, min, fn){
  const i = document.createElement('input'); i.type = 'number'; i.step = step; i.min = min; i.inputMode = 'decimal'; i.value = (+val).toFixed(2);
  i.addEventListener('change', () => { const v = parseFloat(i.value); if (isFinite(v)) fn(v); });
  return i;
}
function selIn(options, val, fn){

  options.forEach(o => { const op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; if (o[0] === val) op.selected = true; s.appendChild(op); });
  s.addEventListener('change', () => fn(s.value)); return s;
}
function txtIn(val, fn){
  const i = document.createElement('input'); i.type = 'text'; i.value = val; i.maxLength = 40;
  i.addEventListener('change', () => fn(i.value.trim())); return i;
}
function btn(text, fn, cls){ const b = el('button','btn' + (cls ? ' ' + cls : ''), text); b.type = 'button'; b.addEventListener('click', fn); return b; }

const PALETTE = ['#ffffff','#efede8','#e6d9c3','#d3bf9a','#c4a98a','#b9c7b2','#9db4c9','#d5dde2','#9aa5b1','#69707b','#3a4048','#1d252d','#d98b73','#a63a2b','#2f6f8f','#4b7f52','#e2bd4f','#e8c6c6'];
const thumbCache = {};
function thumb(id){
  if (thumbCache[id]) return thumbCache[id];
  const cv = document.createElement('canvas'); cv.width = cv.height = 72;
  const g = cv.getContext('2d');
  let src = null, flat = null;
  if (id.indexOf('t:') === 0) src = texCanvas(id.slice(2));
  else if (id === 'f:parquet') src = cherryBase.image;
  else if (id === 'f:gres') src = gresBase.image;
  else if (id === 'f:pietra') src = texCanvas('pietra');
  else if (id === 'f:marmo') src = texCanvas('marmo');
  else if (id === 'f:cemento') flat = '#c3c6ca';
  else if (id === 'f:balcone') flat = '#b7a595';
  else if (id === 'f:ascensore') flat = '#3a424b';
  if (src){ const q = Math.min(src.width, src.height); g.drawImage(src, 0, 0, q, q, 0, 0, 72, 72); }
  else { g.fillStyle = flat || '#cccccc'; g.fillRect(0, 0, 72, 72); }
  return (thumbCache[id] = cv.toDataURL('image/png'));
}
function colorRow(cur, onPick, allowNone){
  const row = el('div','sws'), lc = cur ? cur.toLowerCase() : null;
  if (allowNone){
    const b = el('button','swb'); b.type = 'button'; b.title = 'Colore predefinito'; b.setAttribute('aria-label','Colore predefinito');
    b.style.background = 'linear-gradient(135deg,#fff 44%,#d33 44%,#d33 56%,#fff 56%)';
    b.setAttribute('aria-pressed', String(!lc)); b.addEventListener('click', () => onPick(null)); row.appendChild(b);
  }
  PALETTE.forEach(c => {
    const b = el('button','swb'); b.type = 'button'; b.style.background = c; b.title = c; b.setAttribute('aria-label','Colore ' + c);
    b.setAttribute('aria-pressed', String(lc === c)); b.addEventListener('click', () => onPick(c)); row.appendChild(b);
  });
  const cu = el('label','swb custom'); cu.title = 'Scegli un altro colore';
  const inp = document.createElement('input'); inp.type = 'color'; inp.value = lc || '#cccccc'; inp.setAttribute('aria-label','Scegli un altro colore');
  inp.addEventListener('change', () => onPick(inp.value)); cu.appendChild(inp);
  if (lc && PALETTE.indexOf(lc) < 0) cu.setAttribute('aria-pressed','true');
  row.appendChild(cu);
  return row;
}
function tileRow(items, cur, onPick, allowNone){
  const row = el('div','tex');
  if (allowNone){
    const b = el('button','tx none','Nessuna'); b.type = 'button'; b.setAttribute('aria-pressed', String(!cur));
    b.addEventListener('click', () => onPick(null)); row.appendChild(b);
  }
  items.forEach(it => {
    const b = el('button','tx'); b.type = 'button'; b.style.backgroundImage = 'url(' + thumb(it.thumb) + ')';
    b.appendChild(el('span', null, it.label)); b.setAttribute('aria-pressed', String(cur === it.id));
    b.addEventListener('click', () => onPick(it.id)); row.appendChild(b);
  });
  return row;
}
function wallFinish(o){
  propsEl.appendChild(section('Colore'));
  propsEl.appendChild(colorRow(o.col, v => mutate(() => { o.col = v || undefined; }), true));
  propsEl.appendChild(section('Texture'));
  propsEl.appendChild(tileRow(Object.keys(TEXDEF).map(k => ({ id:k, label:TEXDEF[k].name, thumb:'t:' + k })), o.tx,
    v => mutate(() => { o.tx = v || undefined; }), true));
  if (o.tx) propsEl.appendChild(note('Con una texture il colore diventa una tinta. Scegli il colore predefinito per vedere la texture al naturale.'));
}

function wallFinishSides(w, h){
  /* h: true = muro orizzontale, false = verticale, null = parapetto / vetrata (più segmenti) */
  const names = h === null ? ['Entrambi','Nord / Ovest','Sud / Est'] : h ? ['Entrambi','Nord','Sud'] : ['Entrambi','Ovest','Est'];
  propsEl.appendChild(section('Lato da colorare'));
  const seg = el('div','segs');
  [['both',names[0]],['a',names[1]],['b',names[2]]].forEach(p => {
    const b = el('button', null, p[1]); b.type = 'button'; b.setAttribute('aria-pressed', String(finishSide === p[0]));
    b.addEventListener('click', () => { finishSide = p[0]; overlayDirty = true; refreshProps(); });
    seg.appendChild(b);
  });
  propsEl.appendChild(seg);
  if (finishSide !== 'both') propsEl.appendChild(note('Il lato scelto è evidenziato in arancione sulla pianta: ' + (finishSide === 'a'
    ? (h === null ? 'quello verso nord o ovest (in alto o a sinistra).' : h ? 'quello verso nord, in alto.' : 'quello verso ovest, a sinistra.')
    : (h === null ? 'quello verso sud o est (in basso o a destra).' : h ? 'quello verso sud, in basso.' : 'quello verso est, a destra.'))));
  const base = { col:w.col, tx:w.tx };
  const cur = finishSide === 'a' ? (w.sa || base) : finishSide === 'b' ? (w.sb || base) : ((w.sa || w.sb) ? {} : base);
  const set = (k, v) => mutate(() => {
    if (finishSide === 'both'){ w[k] = v || undefined; delete w.sa; delete w.sb; }
    else { const key = finishSide === 'a' ? 'sa' : 'sb'; if (!w[key]) w[key] = { col:w.col, tx:w.tx }; w[key][k] = v || undefined; }
  });
  propsEl.appendChild(section('Colore'));
  propsEl.appendChild(colorRow(cur.col, v => set('col', v), true));
  propsEl.appendChild(section('Texture'));
  propsEl.appendChild(tileRow(Object.keys(TEXDEF).map(k => ({ id:k, label:TEXDEF[k].name, thumb:'t:' + k })), cur.tx, v => set('tx', v), true));
  if (cur.tx) propsEl.appendChild(note('Con una texture il colore diventa una tinta. Scegli il colore predefinito per vedere la texture al naturale.'));
}

function refreshProps(){
  propsEl.textContent = '';
  const it = (editing && tool === 'select') ? selItem() : null;
  sheetEl.hidden = !it;
  setHint();
  if (!it) return;
  const add = n => propsEl.appendChild(n);
  const acts = el('div','acts');
  const title = $('stitle');

  if (it.type === 'wall'){
    const w = it.obj, h = isH(w), len = (h ? w.x2 - w.x1 : w.y2 - w.y1) * S;
    title.textContent = w.k === 'e' ? 'Muro esterno' : 'Muro interno';
    add(fld('Tipo', selIn([['e','Muro esterno'],['i','Muro interno']], w.k, v => mutate(() => { w.k = v; }))));
    add(fld('Lunghezza (m)', numIn(len, .05, .2, v => mutate(() => { const L = Math.max(4, v/S); if (h) w.x2 = w.x1 + L; else w.y2 = w.y1 + L; }))));
    wallFinishSides(w, isH(w));
    acts.append(btn('Duplica', duplicateSel), btn('Elimina', deleteSel, 'danger'));
  } else if (it.type === 'op'){
    const w = it.wall, o = it.op, h = isH(w);
    title.textContent = { door:'Porta', win:'Finestra', pf:'Porta-finestra', open:'Varco' }[o.t];
    add(fld('Tipo', selIn([['door','Porta'],['win','Finestra'],['pf','Porta-finestra'],['open','Varco']], o.t, v => mutate(() => { o.t = v; }))));
    add(fld('Larghezza (m)', numIn(o.w * S, .05, .2, v => mutate(() => {
      const a = h ? w.x1 : w.y1, b = h ? w.x2 : w.y2, nw = clamp(v/S, 6, b - a);
      o.w = nw; o.p = clamp(o.p, a + nw/2, b - nw/2);
    }))));
    if (o.t === 'door') acts.append(btn('Inverti apertura', () => mutate(() => { o.s = -o.s; })));
    acts.append(btn('Elimina', deleteSel, 'danger'));
  } else if (it.type === 'column'){
    const c = it.obj; title.textContent = 'Colonna';
    add(fld('Larghezza (m)', numIn((c.x1 - c.x0)*S, .05, .1, v => mutate(() => { c.x1 = c.x0 + Math.max(2, v/S); }))));
    add(fld('Profondità (m)', numIn((c.y1 - c.y0)*S, .05, .1, v => mutate(() => { c.y1 = c.y0 + Math.max(2, v/S); }))));
    wallFinish(c);
    acts.append(btn('Duplica', duplicateSel), btn('Elimina', deleteSel, 'danger'));
  } else if (it.type === 'floor'){
    const f = it.obj; title.textContent = 'Pavimento';
    add(fld('Nome', txtIn(f.name, v => mutate(() => { f.name = v; }))));
    add(section('Materiale'));
    const keys = Object.keys(FLOORS).filter(k => k !== 'ascensore' || f.m === 'ascensore');
    add(tileRow(keys.map(k => ({ id:k, label:FLOORS[k].name, thumb:'f:' + k })), f.m === 'colore' ? null : f.m, v => mutate(() => { f.m = v; }), false));
    add(section('Colore unico'));
    add(colorRow(f.m === 'colore' ? f.col : null, v => mutate(() => { f.m = 'colore'; f.col = v; }), false));
    acts.append(btn('Duplica', duplicateSel), btn('Elimina', deleteSel, 'danger'));
  } else if (it.type === 'rail'){
    const r = it.obj; title.textContent = { rail:'Parapetto', glazed:'Vetrata', fence:'Ringhiera' }[r.kind];
    add(fld('Tipo', selIn([['rail','Parapetto pieno'],['glazed','Vetrata'],['fence','Ringhiera']], r.kind, v => mutate(() => { r.kind = v; }))));
    if (r.kind !== 'glazed') add(fld('Altezza (m)', numIn(r.h || 1, .05, .3, v => mutate(() => { r.h = clamp(v, .3, 2); }))));
    if (r.kind === 'glazed') add(note('Colore e texture riguardano il muretto sotto la vetrata. Il lato interno della veranda è quello verso sud o est.'));
    if (r.kind === 'fence'){
      add(section('Colore della ringhiera'));
      add(colorRow(r.col, v => mutate(() => { r.col = v || undefined; }), true));
    } else wallFinishSides(r, null);
    if (r.pts.length > 2) acts.append(btn('Separa i tratti', splitRail));
    acts.append(btn('Duplica', duplicateSel), btn('Elimina', deleteSel, 'danger'));
  } else if (it.type === 'label'){
    const l = it.obj; title.textContent = 'Nome sul pavimento';
    add(fld('Testo', txtIn(l.text, v => mutate(() => { l.text = v; }))));
    add(fld('Larghezza (m)', numIn(labelWpx(l)*S, .1, .3, v => mutate(() => { l.w = clamp(v/S*0.03, .3, 8); }))));
    acts.append(btn('Duplica', duplicateSel), btn('Elimina', deleteSel, 'danger'));
  }
  add(acts);
}

const KEY = 'piantina-via-verona-v2' + (publishedTs ? '-' + publishedTs : '');
let dbDoc = null, saveTimer = null, userEdited = false;
function statusMsg(t){ $('status').textContent = t; }
function updateFileNote(){
  const same = JSON.stringify(plan) === publishedJson;
  $('fileNote').textContent = artifactApi === false
    ? 'In questa vista non puoi salvare nel file condiviso.'
    : same ? 'La piantina condivisa è aggiornata: chi apre il link vede questa versione.'
           : 'Ci sono modifiche non ancora nel file condiviso. Premi il pulsante per farle vedere a chi apre il link.';
}
function scheduleSave(){
  updateFileNote();

async function saveNow(){

  let local = false, remote = false;
  try { localStorage.setItem(KEY, JSON.stringify({ ts:ts, json:json })); local = true; } catch(e){}
  if (dbDoc){ try { await dbDoc.set({ json:json, ts:ts }); remote = true; } catch(e){} }
  const t = new Date().toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
  statusMsg(remote ? 'Salvato alle ' + t + ' sul tuo account.'
          : local  ? 'Salvato alle ' + t + ' su questo dispositivo.'
                   : 'Non sono riuscito a salvare. Usa Esporta per conservare la piantina.');
}
function tryApply(json){
  try {
    const n = normalize(JSON.parse(json));
    if (!n.walls.length) return false;
    plan = n; rebuild(); validateSel(); overlayDirty = true; refreshProps(); return true;
  } catch(e){ return false; }
}
async function initStorage(){
  let localTs = 0;
  try { const raw = localStorage.getItem(KEY); if (raw){ const o = JSON.parse(raw); if (o && o.json && (o.ts || 0) > publishedTs && tryApply(o.json)) localTs = o.ts || 0; } } catch(e){}
  try {
    if (!window.claude || !window.claude.use) return;
    const caps = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const db = caps[0], user = caps[1];
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    dbDoc = db.doc('data/users/' + id + '/plan');
    const snap = await dbDoc.get();
    if (snap.exists){
      const d = snap.data();
      if (d && d.json && (d.ts || 0) > Math.max(localTs, publishedTs) && !userEdited && tryApply(d.json)) statusMsg('Piantina caricata dal tuo account.');
      else if (d && localTs > (d.ts || 0) && !userEdited) saveNow();
    } else if (localTs && !userEdited) saveNow();
  } catch(e){}
}
$('save').addEventListener('click', saveNow);

/* ---------- salvataggio dentro il file (versione condivisa) ---------- */
let artifactApi = null;      // null = non ancora noto, false = non disponibile
const HEAD_HTML = "<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Appartamento di Via Verona, piantina in 3D</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n";
function buildHtml(planObj, o){
  const json = JSON.stringify({ ts:Date.now(), plan:planObj, view:(o && o.view) ? 1 : undefined }).replace(/</g, '\\u003c');
  const css = $('appcss').textContent, js = $('app').textContent, markup = $('body-src').innerHTML;
  const end = '<' + '/script>';
  return '<!doctype html>\n<html lang="it">\n<head>\n' + HEAD_HTML + '<style id="appcss">' + css + '</style>\n</head>\n<body>\n' +
    '<template id="body-src">' + markup + '</template>\n' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">' + end + '\n' +
    '<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">' + end + '\n' +
    '<script id="plan-data" type="application/json">' + json + end + '\n' +
    '<script id="app">' + js + end + '\n</body>\n</html>\n';
}
async function saveToFile(){
  if (!artifactApi){ statusMsg('In questa vista non puoi salvare nel file condiviso.'); return; }
  const b = $('saveFile'); b.disabled = true;
  statusMsg('Salvataggio nel file condiviso…');
  try {
    await saveNow();
    await artifactApi.publish(buildHtml(plan));
    statusMsg('Salvato nel file condiviso. La pagina si ricarica.');
  } catch(e){
    b.disabled = false;
    const c = e && e.code;
    statusMsg(c === 'conflict' ? 'Nel frattempo è stata pubblicata un’altra versione: la pagina si ricarica.'
      : (c === 'not_writer' || c === 'not_granted' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed' || c === 'consent_required')
        ? 'Da questa vista non puoi salvare nel file condiviso. Le modifiche restano su questo dispositivo: usa Esporta per conservarle.'
      : c === 'too_large' ? 'La piantina è troppo grande per essere salvata nel file.'
      : 'Salvataggio non riuscito. Riprova fra poco.');
  }
}
$('saveFile').addEventListener('click', saveToFile);

/* ---------- scarica un file HTML da inviare ---------- */
async function downloadHtml(){
  const html = buildHtml(plan, { view:$('optViewOnly').checked });
  const name = 'piantina-via-verona.html';
  try {
    const dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
    if (dl){ await dl.save({ filename:name, data:html }); statusMsg('File pronto: allegalo a una mail.'); return; }
  } catch(e){ if (e && e.code === 'declined') return; }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type:'text/html' })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    statusMsg('File scaricato: allegalo a una mail.');
  } catch(e){ statusMsg('Non riesco a scaricare il file da qui.'); }
}
$('dlfile').addEventListener('click', downloadHtml);
if (viewOnlyFile){ $('btnEdit').hidden = true; $('dlbox').hidden = true; }
async function initArtifact(){
  try {
    if (!window.claude || !window.claude.use){ artifactApi = false; }
    else { const a = await window.claude.use('artifact'); artifactApi = a || false; }
  } catch(e){ artifactApi = false; }
  if (artifactApi === false) $('saveFile').disabled = true;
  updateFileNote();
}

function openDlg(text){ $('dlgtext').value = text; $('dlg').hidden = false; $('dlgtext').focus(); }
$('dlgclose').addEventListener('click', () => { $('dlg').hidden = true; });
$('dlgcopy').addEventListener('click', async () => {
  const ta = $('dlgtext'); ta.select();
  try { await navigator.clipboard.writeText(ta.value); statusMsg('Testo copiato.'); }
  catch(e){ try { document.execCommand('copy'); statusMsg('Testo copiato.'); } catch(_){} }
});
function importText(text){
  let n = null;
  try { n = normalize(JSON.parse(text)); } catch(e){}
  if (!n || !n.walls.length){ statusMsg('Il testo non è una piantina valida.'); return false; }
  const before = JSON.stringify(plan);
  plan = n; sel = null; pushUndo(before); rebuild(); overlayDirty = true; refreshProps();
  statusMsg('Piantina importata.'); return true;
}
$('dlgapply').addEventListener('click', () => { if (importText($('dlgtext').value)) $('dlg').hidden = true; });
$('text').addEventListener('click', () => openDlg(JSON.stringify(plan, null, 1)));
$('import').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => importText(String(r.result)); r.readAsText(f); e.target.value = '';
});
$('export').addEventListener('click', async () => {
  const data = JSON.stringify(plan, null, 1);
  try {
    const dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
    if (dl){ await dl.save({ filename:'piantina-via-verona.json', data:data }); statusMsg('Piantina esportata.'); return; }
  } catch(e){ if (e && e.code === 'declined') return; }
  openDlg(data);
});
let resetArmed = false;
$('reset').addEventListener('click', () => {
  const b = $('reset');
  if (!resetArmed){
    resetArmed = true; b.textContent = 'Confermi?';
    setTimeout(() => { resetArmed = false; b.textContent = 'Ripristina'; }, 3500); return;
  }
  resetArmed = false; b.textContent = 'Ripristina';
  const before = JSON.stringify(plan);
  plan = defaultPlan(); sel = null; pushUndo(before); rebuild(); overlayDirty = true; refreshProps();
  statusMsg('Piantina originale ripristinata. Puoi ancora annullare.');
});

/* ------------------------- Puntatore: passeggiata o editor ------------------------- */
canvas.addEventListener('pointerdown', e => {
  if (mode === 'walk'){
    dragging = true; lx = e.clientX; ly = e.clientY; canvas.focus();
    try { canvas.setPointerCapture(e.pointerId); } catch(_){}
    if (e.pointerType === 'mouse' && !document.pointerLockElement && canvas.requestPointerLock){
      try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch(_){}
    }
    return;
  }
  editorDown(e);
});
canvas.addEventListener('pointermove', e => {
  if (mode === 'walk'){
    if (document.pointerLockElement === canvas){ look(e.movementX || 0, e.movementY || 0, 0.0022); return; }
    if (!dragging) return;
    look(e.clientX - lx, e.clientY - ly, 0.005); lx = e.clientX; ly = e.clientY; return;
  }
  editorMove(e);
});

/* ------------------------- Ciclo di render ------------------------- */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1,h); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const clock = new THREE.Clock();
function ease(t){ return t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  if (tween){
    tween.t += dt / tween.dur;
    const k = ease(Math.min(1, tween.t));
    camera.position.lerpVectors(tween.fp, tween.tp, k);
    controls.target.lerpVectors(tween.ft, tween.tt, k);
    if (tween.t >= 1) tween = null;
  }
  if (mode === 'walk') walk(dt); else controls.update();
  if (needRebuild){ rebuild(); needRebuild = false; }
  if (overlayDirty){ drawOverlay(); overlayDirty = false; }
  if (editing){
    const ks = Math.max(.6, camera.position.distanceTo(controls.target) / 26);
    editG.children.forEach(o => { if (o.userData.handle) o.scale.set(ks, 1, ks); });
  }
  const cur = wallsG.scale.y;
  if (Math.abs(cur - lowTarget) > 0.002) wallsG.scale.y = cur + (lowTarget - cur) * Math.min(1, dt*8);
  else wallsG.scale.y = lowTarget;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* Avvio: attendo il font per le etichette (con tempo massimo) */
function start(){
  rebuild();
  setMode('orbit');
  camera.position.copy(preset('orbit').pos);
  controls.target.copy(preset('orbit').tgt);
  tween = null; controls.update();
  histBtns();
  frame();
  initStorage();
  initArtifact();
}
let started = false;
const go = () => { if (!started){ started = true; start(); } };
if (document.fonts && document.fonts.load){
  Promise.race([ document.fonts.load('700 84px Figtree'), new Promise(r => setTimeout(r, 1500)) ]).then(go, go);
} else go();

})();
</script>

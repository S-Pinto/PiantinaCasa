<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Appartamento di Via Verona, piantina in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" id="appcss" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5f8b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<!-- L’interfaccia: src/core.js la copia nella pagina all’avvio (l’originale resta intatto per il file HTML da scaricare) -->
<template id="body-src"><div id="stage">
  <canvas id="c" tabindex="0" aria-label="Modello 3D dell’appartamento"></canvas>

  <header class="topbar glass">
    <div class="brand">Via Verona</div>
    <div class="seg" role="group" aria-label="Modalità di visualizzazione">
      <button type="button" data-mode="orbit" aria-pressed="true" aria-label="Prospettiva" title="Prospettiva">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg><span class="lbl">Prospettiva</span></button>
      <button type="button" data-mode="plan" aria-pressed="false" aria-label="Pianta" title="Pianta">
        <svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"></rect><path d="M4 13h8V4M12 13v7M16 13h4"></path></svg><span class="lbl">Pianta</span></button>
      <button type="button" data-mode="walk" aria-pressed="false" aria-label="Passeggiata" title="Passeggiata">
        <svg class="i" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"></circle><path d="M13 8v5l-3 7M13 13l3.5 7M9 11l4-3 4 3"></path></svg><span class="lbl">Passeggiata</span></button>
    </div>
    <div class="spacer"></div>
    <button type="button" class="ib edit-only" id="undo" aria-label="Annulla" title="Annulla" hidden="">
      <svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
    <button type="button" class="ib edit-only" id="redo" aria-label="Ripeti" title="Ripeti" hidden="">
      <svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 0 0 0 12h3"></path></svg></button>
    <button type="button" class="ib" id="btnSys" aria-pressed="false" aria-haspopup="true" aria-expanded="false" title="Livelli degli impianti">
      <svg class="i" viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"></path></svg><span class="lbl">Impianti</span></button>
    <button type="button" class="ib" id="btnVar" aria-haspopup="true" aria-expanded="false" title="Versioni di arredo">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4z"></path><path d="M4 12l8 4 8-4"></path><path d="M4 16l8 4 8-4"></path></svg><span class="lbl" id="varLbl">Versioni</span></button>
    <button type="button" class="ib" id="btnEdit" aria-pressed="false" title="Modifica la casa">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"></path><path d="M14 7l3 3"></path></svg><span class="lbl" id="editLbl">Modifica</span></button>
    <button type="button" class="ib" id="btnMenu" aria-haspopup="true" aria-expanded="false" aria-label="Opzioni" title="Opzioni">
      <svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2" fill="currentColor"></circle><circle cx="12" cy="12" r="1.2" fill="currentColor"></circle><circle cx="19" cy="12" r="1.2" fill="currentColor"></circle></svg></button>
  </header>

  <div class="menu glass" id="menu" hidden="">
    <label class="mrow"><span>Nomi delle stanze</span><input type="checkbox" id="optLabels" checked=""></label>
    <label class="mrow"><span>Pareti basse</span><input type="checkbox" id="optLow"></label>
    <label class="mrow"><span>Mostra gli arredi</span><input type="checkbox" id="optFurn" checked=""></label>
    <div id="pwabox" hidden="" style="padding:12px 0 6px;border-bottom:1px solid var(--line)">
      <button type="button" class="btn primary" id="pwaInstall" style="width:100%" hidden="">Installa come app</button>
      <p class="note" id="pwaNote" style="margin-top:8px"></p>
    </div>
    <div id="dlbox" style="padding:12px 0 6px;border-bottom:1px solid var(--line)">
      <button type="button" class="btn primary" id="dlfile" style="width:100%">Scarica il file HTML</button>
      <label class="opt" style="display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px;cursor:pointer"><input type="checkbox" id="optViewOnly" style="width:20px;height:20px;margin:0;accent-color:var(--accent)"> <span>Solo da guardare, senza gli strumenti di modifica</span></label>
      <p class="note" style="margin-top:8px">È un unico file da allegare a una mail: chi lo riceve lo apre col browser, senza accedere a Claude. Serve una connessione a internet.</p>
    </div>
    <label class="mrow edit-only" hidden=""><span>Aggancio automatico</span><input type="checkbox" id="optSnap" checked=""></label>
    <label class="mrow edit-only" hidden=""><span>Allunga i muri collegati</span><input type="checkbox" id="optLink" checked=""></label>
    <div class="edit-only" hidden="" style="margin-top:12px">
      <button type="button" class="btn primary" id="saveFile" style="width:100%">Salva per tutti i dispositivi</button>
      <p class="note" id="fileNote" style="margin-top:8px"></p>
      <div id="ghbox" class="ghbox" hidden="">
        <p class="note">Per salvare sul sito serve una chiave di GitHub, da creare una volta sola per ogni dispositivo:</p>
        <ol class="note">
          <li>apri <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub › Nuova chiave</a>;</li>
          <li>in <b>Repository access</b> scegli <b>Only select repositories</b> › <b>PiantinaCasa</b>;</li>
          <li>in <b>Permissions</b> › <b>Contents</b> scegli <b>Read and write</b>, poi <b>Generate token</b>;</li>
          <li>copia la chiave e incollala qui.</li>
        </ol>
        <input type="password" id="ghToken" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
        <div class="ghacts"><button type="button" class="btn primary" id="ghLink">Collega e salva</button><button type="button" class="btn" id="ghCancel">Annulla</button></div>
        <p class="note">La chiave resta solo su questo dispositivo e serve solo a scrivere la piantina nel tuo progetto.</p>
      </div>
      <button type="button" class="linkbtn note" id="ghForget" hidden="">Scollega GitHub da questo dispositivo</button>
    </div>
    <div class="mgrid edit-only" hidden="">
      <button type="button" class="btn" id="save">Salva ora</button>
      <button type="button" class="btn" id="export">Esporta file</button>
      <button type="button" class="btn" id="import">Importa file</button>
      <button type="button" class="btn" id="text">Testo</button>
      <button type="button" class="btn danger" id="reset" style="grid-column:1 / -1">Ripristina l’originale</button>
    </div>
    <p class="note edit-only" id="status" hidden=""></p>
    <input type="file" id="file" accept=".json,application/json" hidden="">
  </div>

  <div class="vpanel glass" id="vpanel" hidden=""></div>
  <div class="menu glass" id="sysmenu" hidden="">
    <p class="pt">Livelli degli impianti</p>
    <label class="mrow"><span><i class="ldot" style="background:#e8a317"></i>Elettrico</span><input type="checkbox" id="ly-el"></label>
    <label class="mrow"><span><i class="ldot" style="background:#2f86d6"></i>Idraulico</span><input type="checkbox" id="ly-h2o"></label>
    <label class="mrow"><span><i class="ldot" style="background:#2fa36b"></i>Domotica</span><input type="checkbox" id="ly-dom"></label>
    <button type="button" class="btn primary" id="btnQty" style="width:100%;margin-top:12px">Elenco quantità</button>
    <p class="note">Per aggiungere prese, tubi o sensori premi Modifica e scegli Impianti o Tracciati.</p>
  </div>
  <div class="cmpui" id="cmpui" data-dir="h" hidden=""><div class="div"></div><p class="tag ta" id="cmpA"></p><p class="tag tb" id="cmpB"></p></div>

  <div class="levels glass edit-only" id="levels" role="group" aria-label="Cosa vuoi modificare" hidden=""></div>
  <nav class="dock glass edit-only" id="dock" aria-label="Strumenti di modifica" hidden=""></nav>
  <div class="readout" id="readout" aria-live="polite" hidden=""></div>

  <aside class="sheet glass" id="sheet" data-collapsed="0" hidden="">
    <div class="shead">
      <p class="pt" id="stitle"></p>
      <button type="button" class="ib sm" id="scollapse" aria-label="Riduci la scheda" title="Riduci"><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button type="button" class="ib sm" id="sclose" aria-label="Chiudi la scheda" title="Chiudi"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div class="sstack" id="sstack" hidden=""></div>
    <div id="props"></div>
    <div id="sacts"></div>
  </aside>

  <div class="walkui" id="walkui" data-on="0">
    <div class="joy" id="joy" aria-label="Joystick di movimento"><div class="knob" id="knob"></div></div>
    <canvas class="mm" id="mm" width="480" height="232" aria-label="Mappa: tocca per spostarti"></canvas>
    <div class="where" id="where" aria-live="polite"></div>
  </div>
  <p class="hint" id="hint"></p>
  <div class="tip" id="tip" hidden=""></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></symbol>
    <symbol id="i-sunset" viewBox="0 0 24 24"><path d="M7 16a5 5 0 0 1 10 0"></path><path d="M3 16h18M6 20h12M12 4v4M4.9 8.9l1.4 1.4M19.1 8.9l-1.4 1.4"></path></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"></path></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"></path></symbol>
  </svg>

  <div class="vtools glass" id="vtools" role="toolbar" aria-label="Luce, misure e panorama">
    <button type="button" class="vt" id="btnHome" aria-pressed="false" title="Casa: stanze e impianti">
      <svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg><span class="vl">Casa</span></button>
    <button type="button" class="vt" id="btnAmb" aria-haspopup="true" aria-expanded="false" title="Luce: giorno, tramonto, notte">
      <svg class="i" viewBox="0 0 24 24"><use href="#i-sun"></use></svg><span class="vl">Giorno</span></button>
    <button type="button" class="vt" id="btnMis" aria-pressed="false" title="Misure della casa">
      <svg class="i" viewBox="0 0 24 24"><path d="M3 15.5L15.5 3 21 8.5 8.5 21z"></path><path d="M7 12l2 2M10 9l1.5 1.5M13 6l2 2M8.5 15.5l0 0"></path></svg><span class="vl">Misure</span></button>
    <button type="button" class="vt" id="btnNames" aria-pressed="true" title="Nomi delle stanze in 3D">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v10H9l-4 4v-4H4z"></path><path d="M8 9h8M8 12h5"></path></svg><span class="vl">Nomi</span></button>
    <button type="button" class="vt" id="btnRoof" aria-pressed="false" title="Mostra o nascondi il tetto">
      <svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-6 9 6"></path><path d="M5 10v9h14v-9"></path><path d="M10 19v-5h4v5"></path></svg><span class="vl">Tetto</span></button>
    <button type="button" class="vt" id="btnPano" aria-pressed="false" title="Panorama 3D">
      <svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9.5" ry="4.5"></ellipse><path d="M12 7.5c-2 1-3 2.6-3 4.5s1 3.5 3 4.5M12 7.5c2 1 3 2.6 3 4.5s-1 3.5-3 4.5"></path><path d="M18 4.5l1.5 1.5L18 7.5"></path></svg><span class="vl">Panorama</span></button>
  </div>

  <div class="apanel glass" id="apanel" hidden="">
    <div class="segs tod" role="group" aria-label="Momento della giornata">
      <button type="button" data-tod="giorno" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><use href="#i-sun"></use></svg>Giorno</button>
      <button type="button" data-tod="tramonto" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><use href="#i-sunset"></use></svg>Tramonto</button>
      <button type="button" data-tod="notte" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><use href="#i-moon"></use></svg>Notte</button>
    </div>
    <label class="arow"><span>Ora</span><output id="ambHour">13:00</output></label>
    <input type="range" class="arange" id="ambRange" min="5" max="23.99" step="0.05" aria-label="Ora del giorno">
    <p class="note" id="ambSunset" style="margin-top:2px"></p>
    <p class="sl">Stagione</p>
    <div class="segs" id="ambSeason" role="group" aria-label="Stagione">
      <button type="button" data-season="inverno">Inverno</button>
      <button type="button" data-season="mezza">Primavera</button>
      <button type="button" data-season="estate">Estate</button>
    </div>
    <button type="button" class="btn sunbtn" id="sunbtn" aria-pressed="false">Mappa del sole</button>
    <div class="sunleg" id="sunleg" hidden=""><span>ombra</span><i></i><span>8+ ore</span></div>
    <div id="sunres" hidden="" aria-live="polite"></div>
    <p class="sl">Luci di casa</p>
    <div class="segs" id="ambLights" role="group" aria-label="Luci di casa">
      <button type="button" data-lights="auto">Automatiche</button>
      <button type="button" data-lights="on">Accese</button>
      <button type="button" data-lights="off">Spente</button>
    </div>
    <p class="sl">Qualità grafica</p>
    <div class="segs" id="ambQ" role="group" aria-label="Qualità grafica">
      <button type="button" data-q="alta">Alta</button>
      <button type="button" data-q="media">Media</button>
      <button type="button" data-q="bassa">Leggera</button>
    </div>
    <p class="note">Alta aggiunge ombre morbide fra gli oggetti e il bagliore delle luci. Sul telefono parte da Media.</p>
    <label class="arow"><span>Orientamento del nord</span><output id="ambNorthV">0°</output></label>
    <input type="range" class="arange" id="ambNorth" min="-180" max="180" step="1" aria-label="Orientamento del nord">
    <p class="note">Impostato a +32°, misurato su Google Earth: il balcone su Via Mantova guarda a sud-sud-est. Con 0° il nord sarebbe in alto nella piantina.</p>
  </div>

  <button type="button" class="bussola glass" id="bussola" title="Bussola: tocca per inquadrare tutta la casa" aria-label="Bussola: inquadra tutta la casa">
    <svg viewBox="0 0 48 48" aria-hidden="true"><g id="bago"><path d="M24 6l6 18h-12z" fill="#c0392b"></path><path d="M24 42l-6-18h12z" fill="currentColor" opacity=".45"></path><text x="24" y="5.5" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor" dominant-baseline="hanging" transform="translate(0 -5)">N</text></g><circle cx="24" cy="24" r="2.4" fill="currentColor"></circle></svg>
  </button>

  <aside class="mpanel rcard glass" id="rcard" hidden="" aria-label="Scheda della stanza" aria-live="polite">
    <div class="shead">
      <p class="pt" id="rcname"></p>
      <button type="button" class="ib sm" id="rcclose" aria-label="Chiudi la scheda" title="Chiudi"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div class="mtots" id="rctots"></div>
    <p class="sl">Arredi <span id="rcfn"></span></p>
    <ul class="rcfurn" id="rcfurn"></ul>
    <p class="sl">Impianti <span id="rcsn"></span></p>
    <ul class="mlist" id="rcsys"></ul>
    <div class="acts">
      <button type="button" class="btn" id="rcmis">Misure dei muri</button>
      <button type="button" class="btn primary" id="rcwalk">Entra qui</button>
    </div>
  </aside>

  <div class="home" id="home" hidden="" role="dialog" aria-modal="true" aria-labelledby="htitle">
    <div class="hbox glass">
      <div class="shead">
        <div class="pt"><span id="htitle">Casa di Via Verona</span><small>Attico al 7° piano · Brindisi · balconi a sud-sud-est su Via Mantova</small></div>
        <button type="button" class="ib sm" id="hclose" aria-label="Chiudi" title="Chiudi"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <div class="mtots hstats" id="hstats"></div>
      <p class="sl">Stanze</p>
      <div class="hrooms" id="hrooms"></div>
      <p class="sl">Impianti e domotica</p>
      <div class="htiles" id="htiles"></div>
      <p class="note">Per ora qui conti quello che disegni in Modifica › Impianti. Quando la casa avrà la domotica, da questa pagina accenderai le luci, guarderai le telecamere e vedrai i consumi.</p>
    </div>
  </div>

  <aside class="mpanel glass" id="mpanel" data-collapsed="0" hidden="" aria-label="Misure">
    <div class="shead">
      <p class="pt">Misure</p>
      <button type="button" class="ib sm" id="mcollapse" aria-label="Riduci" title="Riduci"><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button type="button" class="ib sm" id="mclose" aria-label="Nascondi le misure" title="Chiudi"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div class="mbody">
      <div class="mtots">
        <div><span class="k">Superficie interna</span><b id="mtot"></b></div>
        <div><span class="k">Balconi e veranda</span><b id="mout"></b></div>
        <div><span class="k">Altezza soffitti</span><b id="mh"></b></div>
      </div>
      <p class="note mcat">Superficie catastale: <b id="mcat"></b> (comprende muri e, in quota, balconi).</p>
      <p class="mpick" id="mpick">Tocca una stanza, nella vista o nell’elenco, per vedere quanto è lungo ogni suo muro.</p>
      <section class="mroom" id="mroom" hidden="" aria-live="polite">
        <div class="mrhead"><b id="mrname"></b><button type="button" class="btn sm" id="mback">Tutta la casa</button></div>
        <div class="mtots">
          <div><span class="k">Superficie netta</span><b id="mrarea"></b></div>
          <div><span class="k">Perimetro</span><b id="mrper"></b></div>
          <div><span class="k">Volume</span><b id="mrvol"></b></div>
        </div>
        <p class="note mpaint">Pareti da pitturare, tolte porte e finestre: <b id="mrpaint"></b></p>
        <ul class="mlist mwalls" id="mwalls"></ul>
        <p class="note">Lunghezze al netto dei muri, misurate sul filo interno. Le lettere sono anche nella vista; in verde le larghezze di porte e finestre.</p>
      </section>
      <label class="mrow mallrow"><span>Lunghezza di tutti i muri, in tutte le stanze</span><input type="checkbox" id="mall"></label>
      <details class="mdet">
        <summary>Stanze una per una (<span id="mcount"></span>)</summary>
        <ul class="mlist" id="mlist"></ul>
        <p class="note">Quote interne al netto dei muri; per le stanze non rettangolari solo la superficie.</p>
      </details>
      <div class="acts">
        <button type="button" class="btn primary" id="mtape" aria-pressed="false">Misura una distanza</button>
        <button type="button" class="btn" id="mclear">Cancella</button>
      </div>
      <p class="note" id="mtapehint" hidden="">Clicca o tocca due punti: muri, pavimento o arredi. Vedi la distanza in pianta e, se c’è, il dislivello.</p>
    </div>
  </aside>

  <div class="panoui" id="panoui" hidden="">
    <div class="pbar glass">
      <button type="button" class="ib" data-tod="giorno" aria-pressed="true" title="Giorno"><svg class="i" viewBox="0 0 24 24"><use href="#i-sun"></use></svg><span class="lbl">Giorno</span></button>
      <button type="button" class="ib" data-tod="tramonto" aria-pressed="false" title="Tramonto"><svg class="i" viewBox="0 0 24 24"><use href="#i-sunset"></use></svg><span class="lbl">Tramonto</span></button>
      <button type="button" class="ib" data-tod="notte" aria-pressed="false" title="Notte"><svg class="i" viewBox="0 0 24 24"><use href="#i-moon"></use></svg><span class="lbl">Notte</span></button>
      <span class="psep"></span>
      <button type="button" class="ib" id="panoRoof" aria-pressed="false" title="Tetto"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-6 9 6"></path><path d="M5 10v9h14v-9"></path><path d="M10 19v-5h4v5"></path></svg><span class="lbl">Tetto</span></button>
